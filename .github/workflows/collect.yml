name: Missile Data Collection

# PAUSED on 2026-05-09 to avoid API charges.
# To resume: uncomment the `schedule:` block below (remove the # in front of each line).
# Original schedule: twice daily — 5:00 AM EST (10:00 UTC) and 8:00 PM EST (01:00 UTC)
# Each run searches the last 12 hours of news for new missile events.
on:
  # schedule:
  #   - cron: '0 10 * * *'
  #   - cron: '0 1 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt anthropic

      - name: Run scheduled collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.scheduled_collection

      - name: Run Monte Carlo simulation
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.simulation
